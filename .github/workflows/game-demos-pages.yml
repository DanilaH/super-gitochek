name: Game Demos Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/game-demos-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-demos-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Validate publishing directory
        run: |
          test -f site/index.html
          if find site -type l -print -quit | grep -q .; then
            echo 'Symlinks are not allowed in the Pages artifact.' >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
