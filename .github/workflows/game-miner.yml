name: Game Miner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      inspect:
        description: New candidates to inspect
        type: number
        required: true
        default: 30
      per_query:
        description: Search hits per query (1-100)
        type: number
        required: true
        default: 30
      pages:
        description: Pages per query (1-10)
        type: number
        required: true
        default: 1

permissions:
  contents: read

concurrency:
  group: game-miner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: |
          python -m py_compile game_miner.py curate_catalog.py incremental_scan.py discovery_policy.py
          python -m unittest discover -s tests -v

  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci-cross-engine-smoke'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover unseen projects and generate catalogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSPECT: ${{ inputs.inspect || (github.event_name == 'push' && '7') || '30' }}
          PER_QUERY: ${{ inputs.per_query || (github.event_name == 'push' && '4') || '30' }}
          PAGES: ${{ inputs.pages || '1' }}
        run: |
          python incremental_scan.py --inspect "$INSPECT" --per-query "$PER_QUERY" --pages "$PAGES" --output results --registry data/discovery-registry.json
      - name: Upload full and new-only catalogs
        uses: actions/upload-artifact@v4
        with:
          name: game-miner-catalog
          path: results/
          retention-days: 7
          if-no-files-found: error
      - name: Persist discovery registry for the next scan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovery-registry.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remember inspected game repositories [skip ci]'
            git push origin HEAD:main
          fi
